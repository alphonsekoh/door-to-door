# Door to Door settings. Copy this file to config.yaml and edit it.
#
# Read when the server starts, never bundled into the build: change a value,
# restart, no rebuild. Where the file lives: CONFIG_PATH, default ./config.yaml.
# On a host with no file to read, put this same text in CONFIG_YAML instead (not
# both).
#
# SECRETS ARE NOT IN THIS FILE. The database username and password, the
# session-signing secret and the Google client secret come from environment
# variables (see README, "Environment variables", and .env.example). A database.url that contains a
# username or password is refused at startup.
#
# Unknown keys are errors, so a typo cannot silently fall back to a default.

database:
  # Connection URL WITHOUT credentials. The username and password are added
  # from DATABASE_USER and DATABASE_PASSWORD (or DATABASE_USER_FILE and
  # DATABASE_PASSWORD_FILE).
  url: postgresql://localhost:5432/door_to_door

auth:
  # Trust the Host header from a reverse proxy. Leave true behind Docker, a
  # load balancer or any proxy; set false only when the app is exposed directly
  # and its public URL is fixed with AUTH_URL. Default: true.
  trustHost: true

  # Issue the session and CSRF cookies Secure, with the __Secure- and __Host-
  # prefixes, whatever scheme the request arrived with. Keep it true for any
  # deployment, so the cookies stay Secure even when the proxy forgets to send
  # X-Forwarded-Proto: https. Set it false only for a plain-http run: Safari
  # on localhost, or a phone on the LAN, will not keep a Secure cookie over
  # http, so sign-in would say "This page expired. Reload it and try again."
  # however often it is reloaded (MissingCSRF in the server log). Default: true.
  secureCookies: true

  # Google sign-in. Set it to offer "Sign in with Google" above the email
  # form; leave it out for email and password only. Only addresses an admin
  # has added can sign in. Setting it makes AUTH_GOOGLE_SECRET (or
  # AUTH_GOOGLE_SECRET_FILE) required at startup. The client ID is public; the
  # secret never goes in this file. On the Google OAuth client, the authorised
  # redirect URI is <public origin>/api/auth/callback/google.
  # google:
  #   clientId: 1234567890-abcdef.apps.googleusercontent.com
  #   # Required. gmail.com and Google Workspace domains; list a secondary domain's primary too.
  #   domains: [gmail.com, tjc.sg, tjc.org]
  #   # TEST ONLY. A stand-in OpenID provider in place of Google, as the
  #   # end-to-end tests run one. Never set it in production.
  #   # issuer: http://localhost:4210

rateLimit:
  # Failed sign-in attempts allowed per email within the window, before further
  # attempts (even the correct password) are refused until it passes. A
  # successful sign-in clears the count. Whole number, at least 1. Default: 10.
  signInAttempts: 10

  # Failed sign-in attempts allowed per client address within the window,
  # across every email it tries, so one client cannot try a common password
  # against every account. A successful sign-in gives back only its own
  # attempt. Counted only when trustedProxyHops is at least 1. Whole number, at
  # least 1. Default: 30.
  signInAttemptsPerClient: 30

  # INCIDENT SWITCH, off by default (unset means no app-wide budget). Failed
  # sign-in attempts allowed across the whole app within the window. Once it is
  # spent, EVERY new sign-in is refused, the correct password and admins
  # included, until the window passes. Anyone can spend it, so setting it lets
  # anyone block every new sign-in. Set it only during an attack and remove it
  # afterwards (each change needs a restart). Members already signed in stay
  # signed in. Whole number, at least 1.
  # signInAttemptsGlobal: 100

  # Length of that window, in seconds, for all three budgets. Whole number, at
  # least 1. Default: 300.
  signInWindowSeconds: 300

  # How many reverse proxies in front of the app append to X-Forwarded-For.
  # The client is the entry that many places from the right; anything further
  # left the client may have written itself. Leave 0 with no proxy, or one you
  # are not sure appends: 0 turns the per-client budget off. Whole number, at
  # least 0. Default: 0.
  #
  # Get it right, and count every proxy that appends, the platform's load
  # balancer included. Too LOW keys every client on a proxy's own address: one
  # bucket of signInAttemptsPerClient shared by everyone, which anyone can spend
  # to block every new sign-in, and nothing warns. Too HIGH lets a client that
  # sends its own X-Forwarded-For choose its key; clients that send none, and
  # proxies that write ip:port entries, leave no usable entry, so they share one
  # unattributed bucket, and the logs show the throttled warning "Sign-in from
  # no usable X-Forwarded-For entry". After deploying, check it directly: the
  # client's real address must be exactly this many places from the right of
  # X-Forwarded-For as the app receives it.
  trustedProxyHops: 0

sync:
  # How far a phone's clock may differ from the server's, in seconds, before
  # an offline visit's timestamp is not trusted. Whole number, at least 1.
  # Default: 300.
  clockSkewToleranceSeconds: 300

# AUTH_SECRET (environment, not this file) signs session cookies. It must be
# random and at least 32 characters: openssl rand -base64 32
