name: door-to-door

# Settings are a file, secrets are environment. CONFIG_FILE picks the file
# (default config.docker.yaml, which reaches the database as host `db`). It is
# mounted outside /app so the source bind-mount cannot shadow it. The
# credentials below are throwaway local defaults; override them in the shell.
# Being public, they and next dev are published on this machine's loopback
# only, never the LAN.
x-credentials: &credentials
  DATABASE_USER: ${DATABASE_USER:-postgres}
  DATABASE_PASSWORD: ${DATABASE_PASSWORD:-postgres}

x-settings: &settings ${CONFIG_FILE:-./config.docker.yaml}:/config/config.yaml:ro

# migrate and seed: one-shot runs of a script from the dev image, against the
# database CONFIG_FILE names.
x-script: &script
  build:
    context: .
    target: dev
  environment:
    <<: *credentials
    CONFIG_PATH: /config/config.yaml
  depends_on:
    db:
      condition: service_healthy
  volumes:
    - .:/app
    - node_modules:/app/node_modules
    - *settings

services:
  db:
    image: postgres:17-alpine@sha256:e5d2edd28b1f8d40a0a6c0c9cdc545b19b56a0d5d88f94bc11a97d970d4700d0
    environment:
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      POSTGRES_DB: door_to_door
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # migrate waits on this, so the runner never races a starting database.
      test: ["CMD-SHELL", "pg_isready -U postgres -d door_to_door"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Scratch database for integration tests. tmpfs-backed: the data is
  # disposable and never needs to outlive the container.
  db-test:
    image: postgres:17-alpine@sha256:e5d2edd28b1f8d40a0a6c0c9cdc545b19b56a0d5d88f94bc11a97d970d4700d0
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: door_to_door_test
    ports:
      - "127.0.0.1:5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d door_to_door_test"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Migrations only, run once. web waits for it to complete successfully, so
  # the app never starts against an unmigrated database. It is safe to point
  # at production: docker compose run --rm --no-deps migrate (see README).
  migrate:
    <<: *script
    command: ["npm", "run", "db:migrate"]

  # The demo data, once migrate is done. The seed refuses a database with
  # users of its own, and web never waits on it, so a refusal here leaves the
  # dev server running.
  seed:
    <<: *script
    command: ["npm", "run", "db:seed", "--", "--demo"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      target: dev
    environment:
      <<: *credentials
      # A public value, so the app refuses it outside next dev. Set AUTH_SECRET
      # in the environment for anything else.
      AUTH_SECRET: ${AUTH_SECRET:-compose-local-dev-secret-0f3a9c71d2b84e56-not-for-production}
      CONFIG_PATH: /config/config.yaml
      # Bind-mounted source on macOS and Windows does not deliver inotify
      # events, so the dev server polls instead.
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - .:/app
      - *settings
      # Anonymous volumes so the host's node_modules and .next never shadow
      # the container's - they hold platform-specific binaries.
      - node_modules:/app/node_modules
      - next_cache:/app/.next

volumes:
  pgdata:
  node_modules:
  next_cache:
