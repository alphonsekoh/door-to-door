openapi: 3.1.1

info:
  title: Door to Door API
  version: 0.1.0
  license:
    name: UNLICENSED
    url: https://github.com/alphonsekoh/door-to-door
  description: |
    Records door-to-door visits and the follow-ups they generate.

    ## Domain model

    A **household** is a unit in a block, identified by `(blockId, unitNumber)`.
    Its identity fields — `name`, `contact`, `religion` — are *latest known* and are
    only ever updated with non-null values, so a later visit that learns nothing
    cannot erase what an earlier visit recorded.

    A **visit** is one knock. `interestLevel` and `description` belong to the visit
    and are never overwritten, so the interest trajectory over time stays visible.

    A **follow-up** attaches to the household, not the session, so it survives
    across outings. A follow-up is either `listed` (on the follow-up list, which
    only an admin can put it on) or `suggested` (a member's request for a return
    visit, waiting for an admin to review). Removing a follow-up is a soft
    delete: the row stays, with who removed it, when and why, and only an
    admin's audit view (and the author, for their own notes) can read it.

    ## Sessions

    At most **one session is active app-wide** at a time, enforced by a database
    constraint, whatever its kind. Admins attach blocks to a live session; members
    self-select which block to work. Blocks are shared — never locked to one member.

    A session's `kind` is fixed when it is created. A `regular` session is
    door-to-door knocking: any unit in an attached block may be recorded. A
    `follow_up` session goes back to households an admin **picks** from the
    follow-up list, at least one, always. Its blocks are the blocks of those
    households, kept in step by the server; an admin never attaches or
    detaches them by hand. A member may record a visit only at a household on
    that session's list (its *revisits*: picked, and still on the follow-up
    list), while an admin may record anywhere in its blocks.

    ## Offline

    `visits.id` is generated by the client as a UUIDv7. Replaying a queued write
    upserts the same row rather than creating a duplicate, which is what makes
    `POST /visits/sync` safe to retry.

    ## Authorization

    Every operation requires an authenticated session. Operations marked
    **Requires: admin** reject members with `403`. Authorization is always
    re-checked server-side; client-side role checks are for UI affordance only.

    Because sessions are JWTs, a session issued before an account was
    deactivated stays cryptographically valid. Deactivation is therefore
    re-checked on every request: a deactivated account receives
    `403 account_deactivated` from **every** operation, including `/users/me`.

servers:
  - url: /api
    description: Same-origin API

security:
  - sessionCookie: []

tags:
  - name: Sessions
    description: Outing sessions and the blocks attached to them
  - name: Blocks
    description: The block registry
  - name: Households
    description: Units and their accumulated history
  - name: Visits
    description: Recording and amending knocks
  - name: Follow-ups
    description: Notes waiting on a return visit
  - name: History
    description: Consolidated and per-member historical records
  - name: Users
    description: Member and role management
  - name: Teams
    description: Joining an outing and working it as a pair or small group

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: authjs.session-token
      description: |
        Auth.js session cookie, set by Google SSO or credentials sign-in.
        Sessions are JWTs: the Credentials provider cannot use database sessions.

  schemas:
    # ------------------------------------------------------------ enumerations
    # These mirror the Drizzle pgEnum values exactly. A test asserts parity, so
    # changing one here without changing the schema fails the build.

    Role:
      type: string
      enum: [admin, member]

    Religion:
      type: string
      description: Nullable everywhere. A member may learn nothing at the door.
      enum: [buddhist, christian, hindu, freethinker, others]

    InterestLevel:
      type: string
      description: |
        `no_response` is a real outcome, not a missing value — most knocks go
        unanswered.
      enum: [low, medium, high, no_response]

    SessionStatus:
      type: string
      description: |
        `reopen` moves `ended` back to `active`, so no separate status is needed.
      enum: [draft, active, ended]

    SessionKind:
      type: string
      description: |
        `regular` is door-to-door knocking. `follow_up` revisits households on
        the follow-up list. Set at creation and never changed.
      enum: [regular, follow_up]

    FollowUpStatus:
      type: string
      description: |
        `listed` is on the follow-up list: an admin created it, or promoted a
        suggestion. `suggested` is a member's request for a return visit,
        waiting for an admin to add it to the list or dismiss it. A suggestion
        is not a list entry and is never resolved.
      enum: [suggested, listed]

    # ----------------------------------------------------------------- errors

    ErrorCode:
      type: string
      enum:
        - validation_failed
        - unauthenticated
        - forbidden
        - account_deactivated
        - not_found
        - conflict
        - session_not_active
        - session_already_active
        - clock_skew
        - block_in_use
        - not_on_follow_up_list
        - follow_up_exists
        - rate_limited
        - internal_error

    FieldError:
      type: object
      additionalProperties: false
      required: [path, message]
      properties:
        path:
          type: string
          description: JSON pointer to the offending field, e.g. `/unitNumber`.
          examples: ["/unitNumber"]
        message:
          type: string
          examples: ["Unit number is required"]

    Error:
      type: object
      additionalProperties: false
      required: [error]
      description: The single error envelope used by every operation.
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              $ref: "#/components/schemas/ErrorCode"
            message:
              type: string
              description: Human-readable, safe to show a user.
            details:
              type: array
              description: Present on `validation_failed`.
              items:
                $ref: "#/components/schemas/FieldError"

    # ------------------------------------------------------------- pagination

    PaginationMeta:
      type: object
      additionalProperties: false
      required: [limit, offset, total, hasMore]
      properties:
        limit:
          type: integer
          examples: [50]
        offset:
          type: integer
          examples: [0]
        total:
          type: integer
          description: Total rows matching the filter, ignoring pagination.
          examples: [237]
        hasMore:
          type: boolean

    # ---------------------------------------------------------------- entities

    User:
      type: object
      additionalProperties: false
      required: [id, email, name, role, deactivatedAt, lastRecordedAt, createdAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        name:
          type: [string, "null"]
          description: Absent until an SSO profile or an admin supplies one.
        image: { type: [string, "null"], format: uri }
        role: { $ref: "#/components/schemas/Role" }
        deactivatedAt:
          type: [string, "null"]
          format: date-time
          description: |
            Deactivated users cannot sign in, but their records stay attributed
            to them — history must survive someone leaving the team.
        lastRecordedAt:
          type: [string, "null"]
          format: date-time
          description: |
            When this user last recorded a visit. Null for someone who has
            never knocked — which is how an account nobody uses is spotted.
        createdAt: { type: string, format: date-time }

    Block:
      type: object
      additionalProperties: false
      required: [id, name, street, postalCode, createdAt]
      properties:
        id: { type: string, format: uuid }
        name:
          type: string
          description: Block number as written, e.g. `123`.
          minLength: 1
          maxLength: 16
          examples: ["123"]
        street:
          type: string
          minLength: 1
          maxLength: 120
          examples: ["Ang Mo Kio Ave 3"]
        postalCode: { type: [string, "null"], maxLength: 16 }
        createdAt: { type: string, format: date-time }

    SessionBlock:
      description: A block attached to a session, with live progress.
      type: object
      additionalProperties: false
      required: [block, visitCount, householdCount, activeMembers]
      properties:
        block: { $ref: "#/components/schemas/Block" }
        visitCount:
          type: integer
          description: Visits recorded on this block during this session.
        householdCount:
          type: integer
          description: Distinct units recorded on this block during this session.
        activeMembers:
          type: array
          description: |
            Members who have recorded here recently. Informational only — blocks
            are shared and never locked.
          items: { $ref: "#/components/schemas/UserSummary" }

    UserSummary:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: [string, "null"] }
        image: { type: [string, "null"], format: uri }

    OutingSession:
      type: object
      additionalProperties: false
      required: [id, title, kind, status, startedAt, endedAt, createdBy, createdAt]
      properties:
        id: { type: string, format: uuid }
        title: { type: string, minLength: 1, maxLength: 160 }
        kind: { $ref: "#/components/schemas/SessionKind" }
        status: { $ref: "#/components/schemas/SessionStatus" }
        startedAt:
          type: [string, "null"]
          format: date-time
          description: Null while the session is a draft.
        endedAt: { type: [string, "null"], format: date-time }
        createdBy: { $ref: "#/components/schemas/UserSummary" }
        createdAt: { type: string, format: date-time }

    ActiveSession:
      description: The active session together with the blocks a member can pick.
      type: object
      additionalProperties: false
      required: [session, blocks, picks]
      properties:
        session: { $ref: "#/components/schemas/OutingSession" }
        blocks:
          type: array
          items: { $ref: "#/components/schemas/SessionBlock" }
        picks:
          type: array
          description: |
            The households an admin picked for a follow-up session, and when,
            so a client can tell which listed notes are on its list without
            reading the list. Empty for a regular session.
          items: { $ref: "#/components/schemas/SessionPick" }

    SessionPick:
      type: object
      additionalProperties: false
      required: [householdId, addedAt]
      properties:
        householdId: { type: string, format: uuid }
        addedAt:
          type: string
          format: date-time
          description: |
            When an admin picked it. A note resolved before this, or before the
            session started, was not this session's work at this household.

    Household:
      type: object
      additionalProperties: false
      required: [id, blockId, unitNumber, name, contact, religion, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        blockId: { type: string, format: uuid }
        unitNumber:
          type: string
          description: Required. Everything else about a household may be unknown.
          minLength: 1
          maxLength: 32
          examples: ["#05-123"]
        name:
          type: [string, "null"]
          maxLength: 160
          description: Latest known. Only ever updated with a non-null value.
        contact: { type: [string, "null"], maxLength: 64 }
        religion:
          description: Null until someone answers the door and says.
          oneOf:
            - $ref: "#/components/schemas/Religion"
            - type: "null"
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    VisitFields:
      description: |
        Every field of a visit, shared by the two shapes a visit is answered
        in: `Visit` is exactly these, and `RecordedVisit` these and
        `followUpsMarkedDone`.
      type: object
      required:
        [
          id,
          householdId,
          sessionId,
          member,
          team,
          interestLevel,
          description,
          clientCreatedAt,
          createdAt,
          updatedAt,
        ]
      properties:
        id:
          type: string
          format: uuid
          description: |
            Generated by the client as a UUIDv7 — the server never assigns one.
            This is what makes a replayed offline write idempotent.
        householdId: { type: string, format: uuid }
        sessionId: { type: string, format: uuid }
        member:
          allOf: [{ $ref: "#/components/schemas/UserSummary" }]
          description: The author. Set once at creation and never reassigned.
        team:
          description: |
            The team the author was on when the server first stored this record,
            or null if none. Stamped once at insert and never changed by a later
            join, leave or amend. `members` is a snapshot:
            the teammates (author excluded) who were on the team at that moment,
            shown with their **current** names. A later joiner is not listed; a
            leaver still is.
          oneOf:
            - $ref: "#/components/schemas/TeamSummary"
            - type: "null"
        interestLevel: { $ref: "#/components/schemas/InterestLevel" }
        description:
          type: string
          description: Required, but may be empty — a silent door has nothing to say.
          maxLength: 4000
        clientCreatedAt:
          type: string
          format: date-time
          description: When the device recorded it, which may long precede receipt.
        createdAt: { type: string, format: date-time }
        updatedAt:
          type: string
          format: date-time
          description: Drives last-write-wins when a queued edit arrives out of order.

    Visit:
      allOf:
        - $ref: "#/components/schemas/VisitFields"
      unevaluatedProperties: false

    RecordedVisit:
      description: |
        The answer to recording a visit: `POST /visits`, and each
        `/visits/sync` result that carries a visit. A `Visit` that also names
        the follow-ups recording it marked done; no other read carries
        `followUpsMarkedDone`.
      allOf:
        - $ref: "#/components/schemas/VisitFields"
        - type: object
          required: [followUpsMarkedDone]
          properties:
            followUpsMarkedDone:
              type: array
              items: { type: string, format: uuid }
              description: |
                The follow-ups that recording this visit marked done and that
                are still done, by id; empty when it marked none. When a new
                visit is stored during a running `follow_up` session at a
                household on that session's list, every outstanding listed
                note there is marked done in the same transaction, with
                `doneBy` the visit's author. An amend never marks anything,
                and neither does a visit in a `regular` session or at a
                household not on the list (where only an admin may record).

                Read from what is stored, so a replay of the same visit id
                reports the same notes and never marks them again or changes
                who closed them. A note reopened since (`PATCH
                /follow-ups/{id}` with `done: false`, which is how a client
                undoes it) or removed is no longer listed here.
      unevaluatedProperties: false

    TeamSummary:
      description: |
        A team as stamped on a visit. `name` is the team's current name;
        `members` is the snapshot described on `Visit.team`.
      type: object
      additionalProperties: false
      required: [id, name, members]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        members:
          type: array
          items: { $ref: "#/components/schemas/UserSummary" }

    Team:
      description: |
        A pair or small group working one outing, with its **current**
        members; a deactivated person is not listed. A user is on at most one
        team per outing.
      type: object
      additionalProperties: false
      required: [id, sessionId, name, members, createdAt]
      properties:
        id: { type: string, format: uuid }
        sessionId: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 60 }
        members:
          type: array
          items: { $ref: "#/components/schemas/UserSummary" }
        createdAt: { type: string, format: date-time }

    Participant:
      description: |
        Someone who has started on an outing. Deactivated people are not listed.
      type: object
      additionalProperties: false
      required: [user, teamId, joinedAt]
      properties:
        user: { $ref: "#/components/schemas/UserSummary" }
        teamId:
          type: [string, "null"]
          format: uuid
          description: The team they are on in this outing, if any.
        joinedAt: { type: string, format: date-time }

    FollowUp:
      type: object
      additionalProperties: false
      required:
        [
          id,
          householdId,
          blockId,
          blockName,
          unitNumber,
          visitId,
          status,
          author,
          note,
          dueDate,
          doneAt,
          doneBy,
          listedAt,
          listedBy,
          deletedAt,
          deletedBy,
          deleteReason,
          waitingSuggestionBy,
          createdAt,
        ]
      properties:
        id: { type: string, format: uuid }
        householdId:
          type: string
          format: uuid
          description: Attached to the household, so it survives across sessions.
        blockId:
          type: string
          format: uuid
          description: |
            The household's block, so a client can tell which notes a session's
            attached blocks cover without a lookup per note.
        status: { $ref: "#/components/schemas/FollowUpStatus" }
        listedAt:
          type: [string, "null"]
          format: date-time
          description: |
            When an admin put it on the follow-up list. Null for a suggestion,
            and for notes listed before suggestions existed.
        listedBy:
          description: The admin who put it on the list, as `listedAt`.
          oneOf:
            - $ref: "#/components/schemas/UserSummary"
            - type: "null"
        deletedAt:
          type: [string, "null"]
          format: date-time
          description: |
            Set when the note was dismissed, withdrawn or removed from the list.
            Always null outside `GET /follow-ups?deleted=true`: every other read
            leaves removed notes out.
        deletedBy:
          description: |
            Who removed it: an admin, or the author withdrawing their own
            suggestion. A note removed by anyone but its author (a declined
            suggestion, or a note taken off the list) is shown to its author,
            with the reason.
          oneOf:
            - $ref: "#/components/schemas/UserSummary"
            - type: "null"
        deleteReason:
          type: [string, "null"]
          maxLength: 500
          description: |
            Why it was removed, given by whoever removed it. Shown to the author
            and to admins. Null while the note is not removed.
        waitingSuggestionBy:
          description: |
            On a listed, not removed note: the author of the suggestion waiting
            for review at the same household, or null. While one waits,
            reopening this note lists that suggestion when an admin does it,
            and is `409 follow_up_exists` for a member. Always null on a
            suggestion and on a removed note.
          oneOf:
            - $ref: "#/components/schemas/UserSummary"
            - type: "null"
        blockName:
          type: string
          description: |
            The household's block, so a list of notes can name the door without
            a lookup per note.
          examples: ["123"]
        unitNumber:
          type: string
          description: The household's unit number, for the same reason.
          examples: ["#05-123"]
        visitId: { type: [string, "null"], format: uuid }
        author: { $ref: "#/components/schemas/UserSummary" }
        note: { type: string, minLength: 1, maxLength: 2000 }
        dueDate:
          type: [string, "null"]
          format: date-time
          description: |
            The start of the due day in the author's time zone. A note is
            overdue once that whole day has passed.
        doneAt: { type: [string, "null"], format: date-time }
        doneBy:
          oneOf:
            - $ref: "#/components/schemas/UserSummary"
            - type: "null"
        createdAt: { type: string, format: date-time }

    HouseholdHistory:
      description: |
        A unit's full timeline. This is what a member sees before knocking, and
        the reason the household/visit split exists.
      type: object
      additionalProperties: false
      required: [household, block, visits, followUps]
      properties:
        household: { $ref: "#/components/schemas/Household" }
        block: { $ref: "#/components/schemas/Block" }
        visits:
          type: array
          description: Oldest first, so the interest trajectory reads left to right.
          items: { $ref: "#/components/schemas/Visit" }
        followUps:
          type: array
          description: |
            Listed notes and pending suggestions, anyone's, oldest first.
            Removed notes are left out.
          items: { $ref: "#/components/schemas/FollowUp" }

    RevisitEntry:
      description: |
        One household on a follow-up session's list: an admin picked it for
        the session, and it has at least one `listed`, not removed note that is
        outstanding or was resolved after both the session started and the
        household was picked (a draft counts outstanding notes only). This is
        the set a member may record visits at in that session.
      type: object
      additionalProperties: false
      required: [household, block, notes, latestVisit, visitedInSession]
      properties:
        household: { $ref: "#/components/schemas/Household" }
        block: { $ref: "#/components/schemas/Block" }
        notes:
          type: array
          minItems: 1
          description: |
            The listed notes that put it on the list: outstanding first (by due
            day, undated last), then those resolved since the later of the
            session's start and the pick, most recently resolved first.
          items: { $ref: "#/components/schemas/FollowUp" }
        latestVisit:
          description: The most recent visit here in any session, or null.
          oneOf:
            - $ref: "#/components/schemas/Visit"
            - type: "null"
        visitedInSession:
          type: boolean
          description: Someone has recorded a visit here during this session.

    RevisitList:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          description: |
            Ordered by block name, then street (two blocks may share a name),
            then unit number, so a block's households are always together.
          items: { $ref: "#/components/schemas/RevisitEntry" }

    SessionHousehold:
      description: |
        A household an admin picked for a follow-up session. Picks change only
        when an admin adds or removes one, so they are the session's record of
        what it set out to do; `onList` says whether the household is on the
        session's list right now. A picked household drops off the list when
        its notes are resolved before the session started, or taken off the
        follow-up list, and returns when it is listed or reopened again.
      type: object
      additionalProperties: false
      required: [household, block, addedAt, notes, onList, visitedInSession]
      properties:
        household: { $ref: "#/components/schemas/Household" }
        block: { $ref: "#/components/schemas/Block" }
        addedAt:
          type: string
          format: date-time
          description: |
            When an admin picked it for this session. A pick needs a note that
            is still owed, so a note resolved before this was not the reason
            for the pick: off the list with no note resolved since, the
            household's owed notes were taken off the follow-up list.
        notes:
          type: array
          description: |
            The household's `listed`, not removed notes, resolved or not:
            outstanding first (by due day, undated last), then resolved, most
            recently resolved first, including any resolved before it was
            picked. Removed notes are never here.
          items: { $ref: "#/components/schemas/FollowUp" }
        onList:
          type: boolean
          description: |
            On the session's list now (`GET /sessions/{id}/revisits`): members
            see it and may record there.
        visitedInSession:
          type: boolean
          description: |
            Someone has recorded a visit here during this session, so it can no
            longer be removed from the session.

    SessionHouseholdList:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          description: |
            Ordered by block name, then street (two blocks may share a name),
            then unit number, so a block's households are always together.
          items: { $ref: "#/components/schemas/SessionHousehold" }

    # ------------------------------------------------------------- requests

    CreateSessionRequest:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 160 }
        kind:
          allOf: [{ $ref: "#/components/schemas/SessionKind" }]
          default: regular
          description: Fixed once created; there is no way to change it later.
        blockIds:
          type: array
          description: |
            A regular session only: blocks to attach immediately. More may be
            added later. Sent with `kind: follow_up` it is `400`, since a
            follow-up session's blocks come from its households.
          items: { type: string, format: uuid }
        householdIds:
          type: array
          description: |
            **Required for `kind: follow_up`**, and `400` for a regular
            session. The households to go back to, each with a `listed`, not
            removed, outstanding note; the session's blocks are theirs.
          minItems: 1
          maxItems: 200
          items: { type: string, format: uuid }

    CreateBlockRequest:
      type: object
      additionalProperties: false
      required: [name, street]
      description: |
        `name` and `street` must contain something other than spaces, and are
        stored trimmed.
      properties:
        name: { type: string, minLength: 1, maxLength: 16, pattern: "\\S" }
        street: { type: string, minLength: 1, maxLength: 120, pattern: "\\S" }
        postalCode: { type: [string, "null"], maxLength: 16 }

    UpdateBlockRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      description: |
        `name` and `street` must contain something other than spaces, and are
        stored trimmed.
      properties:
        name: { type: string, minLength: 1, maxLength: 16, pattern: "\\S" }
        street: { type: string, minLength: 1, maxLength: 120, pattern: "\\S" }
        postalCode: { type: [string, "null"], maxLength: 16 }

    AttachBlocksRequest:
      type: object
      additionalProperties: false
      required: [blockIds]
      properties:
        blockIds:
          type: array
          minItems: 1
          maxItems: 50
          items: { type: string, format: uuid }

    AddSessionHouseholdsRequest:
      type: object
      additionalProperties: false
      required: [householdIds]
      properties:
        householdIds:
          type: array
          minItems: 1
          maxItems: 200
          items: { type: string, format: uuid }

    HouseholdIdentity:
      description: |
        Identity fields are optional and nullable. Omitting a field leaves the
        stored value untouched; sending `null` also leaves it untouched, and so
        does a `name` or `contact` with nothing but spaces. Only a value with
        something in it updates it, stored trimmed — a later visit that learns
        nothing must not erase what an earlier visit recorded.
      type: object
      properties:
        name: { type: [string, "null"], maxLength: 160 }
        contact: { type: [string, "null"], maxLength: 64 }
        religion:
          oneOf:
            - $ref: "#/components/schemas/Religion"
            - type: "null"

    CreateVisitRequest:
      allOf:
        - $ref: "#/components/schemas/HouseholdIdentity"
        - type: object
          required: [id, blockId, unitNumber, interestLevel]
          properties:
            id:
              type: string
              format: uuid
              description: |
                Client-generated UUIDv7. Reusing an id that already exists
                returns `409`; use `PATCH` to amend, or `/visits/sync` to replay.
            blockId: { type: string, format: uuid }
            unitNumber:
              type: string
              minLength: 1
              maxLength: 32
              pattern: "\\S"
              description: |
                The household is created on first contact if new. Must contain
                something other than spaces; stored trimmed.
            interestLevel: { $ref: "#/components/schemas/InterestLevel" }
            description: { type: string, maxLength: 4000, default: "" }
            memberId:
              type: string
              format: uuid
              description: |
                **Requires: admin.** Attributes the visit to this member rather
                than to the caller, for a record phoned in or captured on paper.
                A member supplying anyone else's id is refused with `403`.

                The record belongs to whoever knocked, so authorship is set here
                and never reassigned by a later amendment.
            clientCreatedAt:
              type: string
              format: date-time
              description: |
                Must not be more than the clock tolerance ahead of the server's
                clock; otherwise the request is refused with `422 clock_skew`.
                The tolerance is configurable (`sync.clockSkewToleranceSeconds`
                in config.yaml, default 300).

    UpdateVisitRequest:
      allOf:
        - $ref: "#/components/schemas/HouseholdIdentity"
        - type: object
          minProperties: 1
          properties:
            interestLevel: { $ref: "#/components/schemas/InterestLevel" }
            description: { type: string, maxLength: 4000 }

    # ---------------------------------------------------------------- sync

    VisitSyncItem:
      allOf:
        - $ref: "#/components/schemas/HouseholdIdentity"
        - type: object
          required: [id, blockId, unitNumber, interestLevel, clientCreatedAt, updatedAt]
          properties:
            id: { type: string, format: uuid }
            blockId: { type: string, format: uuid }
            unitNumber:
              type: string
              minLength: 1
              maxLength: 32
              pattern: "\\S"
              description: |
                Must contain something other than spaces; stored trimmed. Like
                any item that breaks this schema, a blank one refuses the whole
                batch with `400`.
            sessionId:
              type: string
              format: uuid
              description: |
                The session the record was captured in. Omit to attach it to the
                currently active session.
            interestLevel: { $ref: "#/components/schemas/InterestLevel" }
            description: { type: string, maxLength: 4000, default: "" }
            clientCreatedAt:
              type: string
              format: date-time
              description: |
                Subject to the same two clock bounds as `updatedAt`. A violation
                rejects this item with `clock_skew`.
            updatedAt:
              type: string
              format: date-time
              description: |
                Decides last-write-wins. An item older than the stored row is
                acknowledged as `stale` and not applied.

                Clock bounds, with one server-configured tolerance
                (`sync.clockSkewToleranceSeconds` in config.yaml, default 300):
                `updatedAt` and `clientCreatedAt` must not be more than the
                tolerance ahead of the server's clock, and must not be earlier
                than the session's `startedAt` minus the tolerance. A violation
                rejects **this item only** with `clock_skew`; siblings still
                apply, and the record stays queued on the client to be restamped
                on retry. A record captured hours ago in a dead zone passes,
                because it falls inside the outing. A replay of an already
                stored record is answered `unchanged` or `stale` before the
                lower bound is checked.

    VisitSyncRequest:
      type: object
      additionalProperties: false
      required: [sentAt, items]
      properties:
        sentAt:
          type: string
          format: date-time
          description: |
            The phone's own clock reading at the moment this request was sent;
            regenerated on every attempt, never reused. If it differs from the
            server's clock by more than the tolerance in either direction, the
            **whole batch** is refused with `422 clock_skew` and nothing is
            applied. This detects a wrong phone clock; it does not authenticate
            it, since a client can lie in it. The per-item bounds on stored
            values are the real protection.
        items:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: "#/components/schemas/VisitSyncItem" }

    VisitSyncResultStatus:
      type: string
      description: |
        `applied` — written. `unchanged` — already present and identical, the
        normal result of a replay. `stale` — an older edit, acknowledged but not
        applied. `rejected` — invalid; see `error`.
      enum: [applied, unchanged, stale, rejected]

    VisitSyncResult:
      type: object
      additionalProperties: false
      required: [id, status]
      properties:
        id: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/VisitSyncResultStatus" }
        visit:
          description: |
            Canonical server state, so the client can reconcile, with
            `followUpsMarkedDone` for any outcome but `rejected`.
          oneOf:
            - $ref: "#/components/schemas/RecordedVisit"
            - type: "null"
        error:
          oneOf:
            - $ref: "#/components/schemas/Error"
            - type: "null"

    VisitSyncResponse:
      description: |
        Always `200` when the batch was well-formed. One invalid item does not
        reject its valid siblings — inspect each result.
      type: object
      additionalProperties: false
      required: [results]
      properties:
        results:
          type: array
          items: { $ref: "#/components/schemas/VisitSyncResult" }

    CreateFollowUpRequest:
      type: object
      additionalProperties: false
      required: [householdId, note]
      properties:
        householdId: { type: string, format: uuid }
        visitId: { type: [string, "null"], format: uuid }
        note:
          type: string
          minLength: 1
          maxLength: 2000
          pattern: "\\S"
          description: Must contain something other than spaces; stored trimmed.
        dueDate: { type: [string, "null"], format: date-time }

    UpdateFollowUpRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        note:
          type: string
          minLength: 1
          maxLength: 2000
          pattern: "\\S"
          description: Must contain something other than spaces; stored trimmed.
        dueDate: { type: [string, "null"], format: date-time }
        done:
          type: boolean
          description: |
            `true` marks it resolved and records who did so; `false` reopens it.
            Only a `listed` note can be resolved. Reopening while a suggestion
            waits at the household (`waitingSuggestionBy`) also lists that
            suggestion when an admin does it, and is `409 follow_up_exists` for
            a member.
        markedByVisit:
          type: string
          format: uuid
          description: |
            Only with `done: false` (`400` otherwise): reopen the note only if
            this visit's recording marked it done (it is in that visit's
            `RecordedVisit.followUpsMarkedDone`). This is how a client undoes
            exactly what a save marked, and nothing since: a note done since
            for any other reason (reopened and marked done again, by hand or
            by another visit) is `409 conflict` and stays done; a note already
            owed is left as it is.
        status:
          type: string
          enum: [listed]
          description: |
            **Requires: admin.** Promotes a suggestion onto the follow-up list,
            recording who did so. Sending it for a note already listed changes
            nothing. There is no way back to `suggested`.

    RemoveFollowUpRequest:
      description: |
        Sent in the body, not the URL, so free text about a household never
        lands in a proxy or access log.
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          description: |
            Why it is being removed. Required for every removal and shown to
            the note's author and to admins. Must contain something other than
            spaces; stored trimmed.
          minLength: 1
          maxLength: 500
          pattern: "\\S"

    CreateUserRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 320 }
        name: { type: [string, "null"], maxLength: 120 }
        password:
          type: string
          minLength: 8
          maxLength: 200
          description: |
            An initial password the admin passes on. There is no invite email
            in this app, so somebody has to hand it over in person.
        role:
          allOf: [{ $ref: "#/components/schemas/Role" }]
          default: member

    CreateTeamRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        memberIds:
          type: array
          uniqueItems: true
          items: { type: string, format: uuid }
          description: |
            Others to place on the team. A member creating a team is always
            included; an admin is not unless listed.

    UpdateTeamRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }

    AddTeamMemberRequest:
      type: object
      additionalProperties: false
      required: [userId]
      properties:
        userId: { type: string, format: uuid }

    UpdateUserRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        role: { $ref: "#/components/schemas/Role" }
        deactivated:
          type: boolean
          description: |
            Deactivating preserves the user's records. An admin cannot
            deactivate or demote their own account.

    UpdateOwnProfileRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 400
          description: |
            One rule: the name is trimmed, then counted in code points (an
            emoji is one), and must be 1 to 80 of them. Refused with
            `400 validation_failed` when blank, over 80, without a
            single letter, number or emoji, or containing control, zero-width
            (including the joiner) or bidirectional-override characters.

            `maxLength` here is only a generous bound on the raw string, so
            surrounding whitespace never decides the outcome; the service
            enforces the 80 on the trimmed name.

            Unknown fields are ignored, not rejected: a `role` sent alongside
            changes nothing.

    # -------------------------------------------------------------- listings

    ParticipantList:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Participant" }

    TeamList:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Team" }

    SessionList:
      type: object
      additionalProperties: false
      required: [data, pagination]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/OutingSession" }
        pagination: { $ref: "#/components/schemas/PaginationMeta" }

    BlockList:
      type: object
      additionalProperties: false
      required: [data, pagination]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Block" }
        pagination: { $ref: "#/components/schemas/PaginationMeta" }

    HouseholdSummary:
      type: object
      additionalProperties: false
      required: [household, visitCount, latestVisit]
      properties:
        household: { $ref: "#/components/schemas/Household" }
        visitCount: { type: integer }
        latestVisit:
          oneOf:
            - $ref: "#/components/schemas/Visit"
            - type: "null"
        outstandingFollowUps:
          type: integer
          description: |
            Unresolved `listed` notes, surfaced before a member knocks so a
            promise is not missed. Suggestions and removed notes do not count.

    HouseholdList:
      type: object
      additionalProperties: false
      required: [data, pagination]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/HouseholdSummary" }
        pagination: { $ref: "#/components/schemas/PaginationMeta" }

    VisitList:
      type: object
      additionalProperties: false
      required: [data, pagination]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Visit" }
        pagination: { $ref: "#/components/schemas/PaginationMeta" }

    FollowUpList:
      type: object
      additionalProperties: false
      required: [data, pagination]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/FollowUp" }
        pagination: { $ref: "#/components/schemas/PaginationMeta" }

    UserList:
      type: object
      additionalProperties: false
      required: [data, pagination]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/User" }
        pagination: { $ref: "#/components/schemas/PaginationMeta" }

    HistoryEntry:
      type: object
      additionalProperties: false
      required: [visit, household, block, session]
      properties:
        visit: { $ref: "#/components/schemas/Visit" }
        household: { $ref: "#/components/schemas/Household" }
        block: { $ref: "#/components/schemas/Block" }
        session: { $ref: "#/components/schemas/OutingSession" }

    HistoryList:
      type: object
      additionalProperties: false
      required: [data, pagination]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/HistoryEntry" }
        pagination: { $ref: "#/components/schemas/PaginationMeta" }

    InterestBreakdown:
      description: |
        How an outing went, counted by outcome. `noResponse` is a real result
        and is counted alongside the rest, not treated as a gap.
      type: object
      additionalProperties: false
      required: [low, medium, high, noResponse]
      properties:
        low: { type: integer }
        medium: { type: integer }
        high: { type: integer }
        noResponse: { type: integer }

    SessionHistorySummary:
      description: |
        One outing as the member who worked it experienced it. Counts describe
        that member's own records only, never the session as a whole.
      type: object
      additionalProperties: false
      required:
        [session, blocks, visitCount, householdCount, interest, firstRecordedAt, lastRecordedAt]
      properties:
        session: { $ref: "#/components/schemas/OutingSession" }
        blocks:
          type: array
          description: Blocks this member recorded on during the outing.
          items: { $ref: "#/components/schemas/Block" }
        visitCount:
          type: integer
          description: Visits this member recorded during the outing.
        householdCount:
          type: integer
          description: Distinct units this member recorded during the outing.
        interest: { $ref: "#/components/schemas/InterestBreakdown" }
        firstRecordedAt:
          type: string
          format: date-time
          description: When this member's first record of the outing was made.
        lastRecordedAt: { type: string, format: date-time }

    SessionHistoryList:
      type: object
      additionalProperties: false
      required: [data, pagination]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/SessionHistorySummary" }
        pagination: { $ref: "#/components/schemas/PaginationMeta" }

    HouseholdAttention:
      description: |
        A door that showed interest and has been left alone since. This is the
        list the whole app exists to produce.
      type: object
      additionalProperties: false
      required: [household, block, latestVisit, visitCount, lastVisitedAt]
      properties:
        household: { $ref: "#/components/schemas/Household" }
        block: { $ref: "#/components/schemas/Block" }
        latestVisit:
          allOf: [{ $ref: "#/components/schemas/Visit" }]
          description: The visit whose interest level put this unit on the list.
        visitCount: { type: integer }
        lastVisitedAt: { type: string, format: date-time }

    HouseholdAttentionList:
      type: object
      additionalProperties: false
      required: [data, pagination]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/HouseholdAttention" }
        pagination: { $ref: "#/components/schemas/PaginationMeta" }

  parameters:
    Limit:
      name: limit
      in: query
      description: Rows per page.
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    Offset:
      name: offset
      in: query
      schema: { type: integer, minimum: 0, default: 0 }
    PathId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    BadRequest:
      description: The request failed validation against this contract.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthenticated:
      description: |
        No valid session. Also returned for a valid token whose account no
        longer exists: the account is looked up on every request, so a deleted
        user's old cookie is treated as signed out.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: |
        Authenticated, but not permitted. Returned to members calling
        admin-only operations, to members amending another member's record, and
        to any account deactivated after its session was issued.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: No such resource, or not visible to this user.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

paths:
  # ============================================================== Sessions
  /sessions:
    get:
      tags: [Sessions]
      operationId: listSessions
      summary: List sessions
      description: "**Requires: admin.** Newest first."
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/SessionStatus" }
        - name: kind
          in: query
          description: Only sessions of this kind. Both when omitted.
          schema: { $ref: "#/components/schemas/SessionKind" }
      responses:
        "200":
          description: Sessions matching the filter.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Sessions]
      operationId: createSession
      summary: Create a draft session
      description: |
        **Requires: admin.** Created as a draft; starting it is a separate
        operation, so an admin can prepare an outing without opening it.
        `kind` defaults to `regular` and can never be changed afterwards.

        A follow-up session is created with its households (`householdIds`,
        at least one) and gets their blocks; it is `400 validation_failed`
        without them, or with `blockIds`. A regular session sending
        `householdIds` is `400` too. All or nothing: one unknown or unlisted
        household creates nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateSessionRequest" }
      responses:
        "201":
          description: The created draft.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OutingSession" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: One of the supplied `blockIds` or `householdIds` does not exist.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: |
            `not_on_follow_up_list`: one of the `householdIds` has no `listed`,
            not removed, outstanding note (a stale screen).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /sessions/active:
    get:
      tags: [Sessions]
      operationId: getActiveSession
      summary: Get the active session and its blocks
      description: |
        Available to all roles — this is the member landing screen. Poll or
        refetch to pick up blocks an admin attaches mid-session, or the
        households (and so blocks) an admin adds to a follow-up session.
      responses:
        "200":
          description: The active session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActiveSession" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404":
          description: |
            No session is active. A normal state, not an error condition —
            clients render an empty state rather than a failure.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /sessions/{id}:
    get:
      tags: [Sessions]
      operationId: getSession
      summary: Get one session
      description: "**Requires: admin.**"
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      responses:
        "200":
          description: The session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OutingSession" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /sessions/{id}/start:
    post:
      tags: [Sessions]
      operationId: startSession
      summary: Start a draft session
      description: |
        **Requires: admin.** Moves `draft` to `active`.

        Only one session may be active app-wide. Starting while another is
        active returns `409 session_already_active` — never a silent takeover.
        The constraint is enforced in the database, so concurrent requests
        cannot both succeed.

        A follow-up session starts only while at least one of its households
        is on its list (a `listed`, not removed note still owed), so members
        never open it to an empty list. Checked under the session's row lock,
        so it holds against an admin removing a household at the same moment.
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      responses:
        "200":
          description: The now-active session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OutingSession" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            `session_already_active`: another session is active. `conflict`:
            this one is not a draft, or it is a follow-up session none of whose
            households is still owed a visit (each was resolved or taken off
            the follow-up list since it was picked), so members would open an
            empty list.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /sessions/{id}/end:
    post:
      tags: [Sessions]
      operationId: endSession
      summary: End the active session
      description: "**Requires: admin.** Moves `active` to `ended`."
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      responses:
        "200":
          description: The ended session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OutingSession" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The session is not active.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /sessions/{id}/reopen:
    post:
      tags: [Sessions]
      operationId: reopenSession
      summary: Reopen an ended session
      description: |
        **Requires: admin.** Moves `ended` back to `active`, restoring write
        access for members.

        This is the recovery path for a session ended by mistake, so it is a
        first-class operation rather than an edge case — a member locked out
        mid-amendment loses work.

        Because only one session may be active, reopening while another is
        active returns `409 session_already_active`. End the other one first.
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      responses:
        "200":
          description: The reopened session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OutingSession" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Another session is active, or this one was never ended.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /sessions/{id}/blocks:
    get:
      tags: [Sessions]
      operationId: listSessionBlocks
      summary: List the blocks attached to a session
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      responses:
        "200":
          description: Attached blocks with their progress.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SessionBlock" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Sessions]
      operationId: attachSessionBlocks
      summary: Attach blocks to a session
      description: |
        **Requires: admin.** Permitted while the session is active, which is the
        contingency path: an admin adds a block mid-outing and members see it on
        their next refresh. Attaching an already-attached block is idempotent.

        A follow-up session's blocks follow its households, so attaching to
        one is `409 conflict`: add households instead.
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AttachBlocksRequest" }
      responses:
        "200":
          description: The session's blocks after attaching.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SessionBlock" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: The session, or one of the blocks, does not exist.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: "`conflict`: the session is a follow-up session."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /sessions/{id}/blocks/{blockId}:
    delete:
      tags: [Sessions]
      operationId: detachSessionBlock
      summary: Detach a block from a session
      description: |
        **Requires: admin.** Detaching a block that already has visits recorded
        returns `409 block_in_use` — history is never orphaned by a UI action.
        A follow-up session's blocks follow its households, so detaching from
        one is `409 conflict`: remove households instead.
      parameters:
        - $ref: "#/components/parameters/PathId"
        - name: blockId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Detached. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            `block_in_use`: the block has visits recorded in this session.
            `conflict`: the session is a follow-up session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /sessions/{id}/revisits:
    get:
      tags: [Sessions]
      operationId: listSessionRevisits
      summary: Households to revisit in a follow-up session
      description: |
        The follow-up session's list: households an admin picked for it that
        have a `listed`, not removed note that is outstanding or was resolved
        after both the session started and the household was picked, so a
        household added to a running session does not bring along a note
        resolved before it was added. This is the same rule that decides where a
        member may record a visit in the session (`409 not_on_follow_up_list`)
        and whether a member may change a listed note, so the list and its
        refusals cannot disagree.

        Members may read the active session's list; a draft or ended session is
        admin-only (`403` for a member), so an admin can check a draft's list
        before starting it. A regular session has no list: `409 conflict`.
        Not paginated: an admin builds the list by hand.
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      responses:
        "200":
          description: The households to revisit.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RevisitList" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`conflict`: the session is a regular session."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /sessions/{id}/households:
    get:
      tags: [Sessions]
      operationId: listSessionHouseholds
      summary: Households picked for a follow-up session
      description: |
        **Requires: admin.** Every household picked for the session, in any
        status, including those not on its list right now (`onList: false`),
        so an admin sees what the session set out to do and can change it.
        An ended session's picks are its record and never change. A regular
        session has no households: `409 conflict`. Not paginated.
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      responses:
        "200":
          description: The picked households.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionHouseholdList" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`conflict`: the session is a regular session."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    post:
      tags: [Sessions]
      operationId: addSessionHouseholds
      summary: Add households to a follow-up session
      description: |
        **Requires: admin.** While the session is a draft or running. Each
        household must have a `listed`, not removed, outstanding note; its
        block joins the session's blocks. A household already picked is left
        as it is. All or nothing: one unknown or unlisted household adds none.
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddSessionHouseholdsRequest" }
      responses:
        "200":
          description: The session's households after adding.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionHouseholdList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: The session, or one of the households, does not exist.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: |
            `conflict`: the session is a regular session, or has ended.
            `not_on_follow_up_list`: a household has no `listed`, not removed,
            outstanding note.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /sessions/{id}/households/{householdId}:
    delete:
      tags: [Sessions]
      operationId: removeSessionHousehold
      summary: Remove a household from a follow-up session
      description: |
        **Requires: admin.** While the session is a draft or running. The
        household's notes stay on the follow-up list for a later session. Its
        block leaves the session's blocks once no picked household is in it.

        Refused, in this order: `404` for a household the session did not
        pick (a door-to-door session picks none), then `409` for an ended
        session, a household someone has recorded a visit at in this session,
        the session's last household, and a block that would leave the
        session while holding visits recorded in this session
        (`block_in_use`, as D-18-3): history is never orphaned by a UI action.
      parameters:
        - $ref: "#/components/parameters/PathId"
        - name: householdId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Removed from the session. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: |
            The session does not exist, or the household is not picked for
            it, which is every household for a door-to-door session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: |
            `conflict`: an ended session, a household visited in this
            session, or the session's last household. `block_in_use`: its
            block holds visits recorded in this session and no other picked
            household.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # ================================================================= Teams
  /sessions/{id}/participants:
    get:
      tags: [Teams]
      operationId: listParticipants
      summary: Who has joined an outing
      description: |
        Members may read the active session's participants; a draft or ended
        session is admin-only (`403` for a member). Each
        participant carries the team they are on, so a picker can offer only
        people who are free to be added.
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      responses:
        "200":
          description: Participants, earliest joined first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ParticipantList" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /sessions/{id}/join:
    post:
      tags: [Teams]
      operationId: joinSession
      summary: Join an outing
      description: |
        Acts on the caller; there is no user parameter. Idempotent: joining
        twice returns the same participant. Members may join only the active
        session (`409 session_not_active` otherwise); an admin may also join a
        draft. Recording a visit or joining a team joins the caller as well, so
        this tap only matters to someone who wants to be addable before they
        have knocked. There is no un-join. **Online only**: never queued.
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      responses:
        "200":
          description: The caller's participation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Participant" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            `session_not_active`: the session is not active (an admin joining a
            draft is allowed; an ended session is refused to everyone).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /sessions/{id}/teams:
    get:
      tags: [Teams]
      operationId: listTeams
      summary: Teams in an outing
      description: Same visibility as participants.
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      responses:
        "200":
          description: Every team, with current members.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeamList" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Teams]
      operationId: createTeam
      summary: Form a team
      description: |
        A member forms a team on the **active** session and is placed on it. An
        admin may form one on a draft or active session and is not placed on it
        unless listed. Anyone listed becomes a participant.

        A member may list only people who have already joined (or recorded).
        An admin may list any active user. **Online only**: never queued.
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTeamRequest" }
      responses:
        "201":
          description: The new team.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Team" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: No such session, or a listed user does not exist.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: |
            `session_not_active` for a member when the session is not active,
            or for anyone when it has ended. `conflict` when the caller or a
            listed user is already on a team in this session, is deactivated,
            or (for a member caller) has not joined.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /teams/{id}:
    patch:
      tags: [Teams]
      operationId: updateTeam
      summary: Rename a team
      description: |
        A current member of the team, or an admin. A member who is not on the
        team is `403`; a member of the team gets `409 session_not_active` once
        the outing is not active (admins are exempt).
        A team you are not on is `403`, not `404`: team ids are listed by
        `GET /sessions/{id}/teams`, so they are not secret.
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateTeamRequest" }
      responses:
        "200":
          description: The updated team.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Team" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`session_not_active`: the outing is not active (members only)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      tags: [Teams]
      operationId: deleteTeam
      summary: Disband a team
      description: |
        A current member or an admin. Refused `409 conflict` once any visit is
        stamped with the team: a team that did work cannot vanish from history.
        Remove members instead.
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      responses:
        "204": { description: Disbanded. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            `conflict`: visits are stamped with this team. `session_not_active`:
            the outing is not active (members only).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /teams/{id}/members:
    post:
      tags: [Teams]
      operationId: addTeamMember
      summary: Add someone to a team
      description: |
        A current member or an admin. A member may add only a participant who
        is active and on no team in this session; an admin may add any active
        user. The added user becomes a participant. They can then amend records
        already stamped with this team, but are not named on earlier records
        (the teammate list on a visit is a snapshot). **Online only.**
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddTeamMemberRequest" }
      responses:
        "200":
          description: The updated team.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Team" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: No such team, or no such user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: |
            `conflict`: already on a team in this session, deactivated, or (for
            a member caller) has not joined. `session_not_active`: the outing is
            not active (members only).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /teams/{id}/members/{userId}:
    delete:
      tags: [Teams]
      operationId: removeTeamMember
      summary: Leave a team, or remove someone
      description: |
        A member may remove only themselves; naming anyone else is `403`. An
        admin may remove anyone. The leaver stays the author of their records,
        which keep the team stamp and still show them to their old teammates;
        they lose the right to amend teammates' records. Removing someone who
        is not on the team is `404`. **Online only.**
      parameters:
        - $ref: "#/components/parameters/PathId"
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The team after removal.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Team" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`session_not_active`: the outing is not active (members only)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # ================================================================ Blocks
  /blocks:
    get:
      tags: [Blocks]
      operationId: listBlocks
      summary: List blocks
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - name: search
          in: query
          description: |
            Case-insensitive partial match on block name or street, so a partial
            block number finds it.
          schema: { type: string, maxLength: 120 }
      responses:
        "200":
          description: Matching blocks.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BlockList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
    post:
      tags: [Blocks]
      operationId: createBlock
      summary: Create a block
      description: |
        **Requires: admin.** `(name, street)` is the natural key; a duplicate
        returns `409` rather than creating a second row.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateBlockRequest" }
      responses:
        "201":
          description: The created block.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Block" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: A block with this name and street already exists.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /blocks/{id}:
    patch:
      tags: [Blocks]
      operationId: updateBlock
      summary: Amend a block
      description: "**Requires: admin.**"
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateBlockRequest" }
      responses:
        "200":
          description: The updated block.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Block" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Another block already uses this name and street.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # ============================================================ Households
  /households:
    get:
      tags: [Households]
      operationId: listHouseholds
      summary: List households in a block
      description: |
        Returns each unit with its latest visit and outstanding follow-up count,
        which is what the block unit list renders.
      parameters:
        - name: blockId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: sessionId
          in: query
          description: Restrict to units recorded during this session.
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Households in the block.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HouseholdList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

  /households/attention:
    get:
      tags: [Households]
      operationId: listHouseholdsNeedingAttention
      summary: Interested households nobody has gone back to
      description: |
        **Requires: admin.** Households whose most recent visit recorded real
        interest and that have no open follow-up.

        Ordered by how long they have been left, oldest first, because the
        cost of this list is a door that said yes and was never revisited.

        A household with an open follow-up — an unresolved `listed` note, or a
        suggestion waiting for review — is deliberately absent: it is already on
        the list or in the review queue, and repeating it here would make the
        list something to scroll past. Removed notes do not count.
      parameters:
        - name: minimumInterest
          in: query
          description: |
            The lowest interest level that counts. `high` by default; widen to
            `medium` for a longer list.
          schema:
            allOf: [{ $ref: "#/components/schemas/InterestLevel" }]
            default: high
        - name: blockId
          in: query
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Households worth a return visit.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HouseholdAttentionList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /households/{id}:
    get:
      tags: [Households]
      operationId: getHouseholdHistory
      summary: Get a unit's full history
      description: |
        Every visit and follow-up for this unit, across all sessions and
        members. Shown before a member knocks — the whole point of the app.
        Includes pending suggestions, so the next member sees one is waiting;
        removed notes are left out.
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      responses:
        "200":
          description: The unit's timeline.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HouseholdHistory" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ================================================================ Visits
  /visits:
    get:
      tags: [Visits]
      operationId: listVisits
      summary: List visits
      parameters:
        - name: sessionId
          in: query
          schema: { type: string, format: uuid }
        - name: blockId
          in: query
          schema: { type: string, format: uuid }
        - name: householdId
          in: query
          schema: { type: string, format: uuid }
        - name: memberId
          in: query
          description: |
            **Requires: admin.** Members may only ever list their own visits;
            supplying another member's id is rejected with `403`.
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Matching visits.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VisitList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Visits]
      operationId: createVisit
      summary: Record a visit
      description: |
        Creates the household on first contact, or reuses the existing one for
        `(blockId, unitNumber)` — this is what makes history accumulate.

        Identity fields update only when a non-null value is supplied.
        `interestLevel` and `description` are recorded on the visit and never
        overwrite an earlier one.

        The visit's block must be attached to the session, and the session must
        be active. The visit is stamped with the author's current team, if any
        (an admin recording on someone's behalf stamps that member's team), and
        the author joins the outing.

        In a `follow_up` session a member may record only at a household on the
        session's list (see `GET /sessions/{id}/revisits`); any other unit is
        `409 not_on_follow_up_list`. The caller's role decides, not the
        author's: an admin may record anywhere in the session's blocks,
        including on a member's behalf.

        Recording a visit at a household on a running `follow_up` session's
        list also marks every outstanding listed note there done, in the same
        transaction, credited to the visit's author; `followUpsMarkedDone`
        names them, so a client can offer to undo it. This holds for members
        and admins alike; an admin recording at a household not on the list
        marks nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateVisitRequest" }
      responses:
        "201":
          description: |
            The recorded visit, with `followUpsMarkedDone` (empty when it
            marked nothing).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecordedVisit" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: A member attributing a visit to someone else.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: The block, or a named `memberId`, does not exist.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: |
            A visit with this id already exists, or no session is active
            (`session_not_active`), or the block is not attached to the active
            session, or a member is recording an unlisted unit in a follow-up
            session (`not_on_follow_up_list`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: |
            `clock_skew`: `clientCreatedAt` is more than the tolerance ahead of
            the server's clock.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /visits/{id}:
    patch:
      tags: [Visits]
      operationId: updateVisit
      summary: Amend a visit
      description: |
        Members may amend their own visits, and visits stamped with a team they
        are **currently** on, while the session is active; admins may amend any
        visit at any time, including historical records. The author and team
        stamp never change.
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateVisitRequest" }
      responses:
        "200":
          description: The amended visit.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Visit" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: A member who is neither the author nor a current member of the visit's team.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            The session has ended, so a member can no longer amend. An admin may
            reopen the session to restore access.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /visits/sync:
    post:
      tags: [Visits]
      operationId: syncVisits
      summary: Flush the offline queue
      description: |
        Batch upsert for records captured offline. Safe to retry: results are
        keyed by the client-generated id, so replaying a batch yields
        `unchanged` rather than duplicate rows.

        Partial success is the norm — a `200` does not mean every item applied.
        Inspect each result's `status`.

        Conflicts resolve last-write-wins on `updatedAt`; an item older than the
        stored row is acknowledged as `stale` and not applied.

        Another member's record is refused as `conflict` unless the caller is a
        **current** member of the team the record is stamped with. An item for a
        stored record, from its author or a teammate, amends interest level,
        description and household identity only: the author, session, team,
        teammate snapshot, `clientCreatedAt` and household are never changed.
        An item naming a different block, unit or `sessionId` than the stored
        record is `conflict` for everyone, the author included. A teammate who was
        removed from the team before the item arrived gets `conflict` too, and a
        queue should hold such an item for review rather than retry it. A
        `rejected` item with error code `internal_error` is different: the server
        failed to save it for a reason unrelated to the record (a dropped
        connection, a deadlock), so it should be retried unchanged. Only
        what has already synced can be amended. New records are stamped with the
        author's team when first stored.

        A new record in a `follow_up` session from a member, at a household not
        on that session's list, is `rejected` with error code
        `not_on_follow_up_list`, the same rule as `POST /visits`; admins are
        exempt. It is not retryable as it stands, but an admin adding the
        household to the list lets the same item through, so a queue should
        hold it and try again now and then rather than discard it. Amending a
        record already stored is never refused for this reason.

        A new record stored in a running `follow_up` session at a household on
        its list marks that household's outstanding listed notes done, exactly
        as `POST /visits` does, when the item is first stored (whenever that
        is, so a record held and sent later marks them then). Every result
        that carries a `visit` carries its `followUpsMarkedDone`: a replay
        answered `unchanged` reports the same notes and marks nothing again.

        Clock skew is reported at two levels, using one tolerance
        (`sync.clockSkewToleranceSeconds` in config.yaml, default 300). A batch
        whose `sentAt` is off from the server's clock is refused whole with
        `422 clock_skew`. An item whose own timestamps break the bounds is
        `rejected` with error code `clock_skew` while its siblings still apply.
        Neither discards anything: the client keeps the records and retries
        after restamping.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VisitSyncRequest" }
      responses:
        "200":
          description: Per-item results, in request order.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VisitSyncResponse" }
        "400":
          description: The batch itself was malformed, e.g. over the item limit.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: |
            `account_deactivated`: the account was deactivated after its session
            was issued. Nothing in the batch was applied. A queue should hold its
            records rather than discard them: if an admin reactivates the
            account, the same batch goes through.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: |
            `clock_skew`: the phone's clock (`sentAt`) is off from the server's
            by more than the tolerance. Nothing in the batch was applied. The
            message states the approximate difference.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: Too many sync requests.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # =========================================================== Follow-ups
  /follow-ups:
    get:
      tags: [Follow-ups]
      operationId: listFollowUps
      summary: List follow-up notes
      description: |
        Outstanding notes sort by due date first, since that is the actionable
        list. Both statuses are returned unless `status` narrows them; a
        suggestion is never resolved, so `outstanding=true` includes every
        pending suggestion.

        Removed notes are left out of every list unless `deleted=true`, which
        returns only removed notes, most recently removed first. That audit
        view is admin-only, except that a member may read their own removed
        notes (`authorId` set to themself) to learn that a suggestion was not
        added, and why. `removedByOthers` and `deletedSince` narrow that view
        on the server, so `total` counts exactly the removals an author is
        told about and paging never spends rows on their own withdrawals;
        either one without `deleted=true` is `400`.
      parameters:
        - name: householdId
          in: query
          schema: { type: string, format: uuid }
        - name: authorId
          in: query
          description: "**Requires: admin** to query another member's notes."
          schema: { type: string, format: uuid }
        - name: status
          in: query
          description: Only notes with this status. Both when omitted.
          schema: { $ref: "#/components/schemas/FollowUpStatus" }
        - name: outstanding
          in: query
          description: "`true` returns only unresolved notes."
          schema: { type: boolean }
        - name: dueBefore
          in: query
          description: |
            Notes due strictly before this instant. For the overdue list, pass the
            start of today in the caller's time zone, so a note due today is not
            yet overdue. Undated notes never match.
          schema: { type: string, format: date-time }
        - name: deleted
          in: query
          description: |
            `true` returns removed notes only. **Requires: admin**, unless
            `authorId` is the caller's own id; otherwise `403`.
          schema: { type: boolean, default: false }
        - name: removedByOthers
          in: query
          description: |
            With `deleted=true` only. `true` returns notes removed by someone
            other than their author (a suggestion declined, a listed note
            taken off the list); `false` returns those their author removed
            (a suggestion withdrawn). Both when omitted. Without
            `deleted=true`, `400`.
          schema: { type: boolean }
        - name: deletedSince
          in: query
          description: |
            With `deleted=true` only. Notes removed at or after this instant.
            Without `deleted=true`, `400`.
          schema: { type: string, format: date-time }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Matching follow-ups.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FollowUpList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Follow-ups]
      operationId: createFollowUp
      summary: Add a follow-up, or suggest one
      description: |
        Attaches to the household, so the note is still there when someone
        knocks on that door months later.

        The caller's role decides the status. An admin's note goes straight on
        the follow-up list (`listed`); a household may carry several. A
        member's note is a `suggested` return visit for an admin to review,
        allowed in any session or none. A member is refused
        `409 follow_up_exists` when the household already has an open
        follow-up: an unresolved `listed` note, or any pending suggestion. The
        database holds the one-pending-suggestion rule, so two members
        suggesting at once cannot both succeed. An admin is refused
        `409 follow_up_exists` while the household has a pending suggestion:
        the admin lists that suggestion instead (`PATCH` with
        `status: listed`), so it never waits on a household already listed
        and its author is never told it was declined. Removed notes never
        block a new note.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateFollowUpRequest" }
      responses:
        "201":
          description: The created note.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FollowUp" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404":
          description: The household, or the referenced visit, does not exist.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: |
            `follow_up_exists`: a member suggesting a household that is already
            on the follow-up list or already has a suggestion waiting, or an
            admin adding a household whose suggestion is waiting for review.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /follow-ups/{id}:
    patch:
      tags: [Follow-ups]
      operationId: updateFollowUp
      summary: Amend, resolve or promote a follow-up
      description: |
        Admins may change anything on any note at any time, and are the only
        ones who may send `status: listed` to put a suggestion on the list.

        **A suggestion** belongs to its author until an admin acts on it: the
        author may change its text and due date at any time; any other member
        gets `403`. It has no done state, so `done` on a suggestion is
        `409 conflict` (an admin may promote and resolve in one request).

        **A listed note** is changed by members only while it is on the list of
        the running follow-up session (the rule behind
        `GET /sessions/{id}/revisits`); otherwise `409 not_on_follow_up_list`.
        Within that session any member may resolve or reopen it: whether the
        thing got done is a fact about the household, and `doneBy` keeps it
        attributable. Its text and due date stay with the author: another
        member gets `403`, and a body that sets `done` together with `note` or
        `dueDate` is judged as an edit.

        Marking a note that is already done as done again changes nothing:
        `doneAt` and `doneBy` keep the first resolution, so a stale screen
        cannot take the credit. Reopening clears `doneBy`, and the link to a
        visit that marked it done (see `RecordedVisit.followUpsMarkedDone`), so
        `done: false` with `markedByVisit` is how a client undoes what
        recording a visit marked done. It never changes the visit.

        **Reopening while a suggestion waits** at the household
        (`waitingSuggestionBy` is set): an admin's reopen also lists that
        suggestion in the same change (`listedBy` is the admin), so its author
        sees it added, never declined. A member's is
        `409 follow_up_exists`: an admin reviews the suggestion first. The
        check is made under the household's lock, so a suggestion sent at the
        same moment is either refused or listed with the reopen.

        A removed note is `404` to everyone. Refusals are checked in the order
        `404`, `403`, `409`.
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateFollowUpRequest" }
      responses:
        "200":
          description: The updated note.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FollowUp" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: |
            A member promoting, changing another member's suggestion, or
            changing the text or due date of a listed note they did not write.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            `conflict`: resolving a suggestion, or undoing with `markedByVisit`
            a note done since for another reason. `not_on_follow_up_list`: a
            member changing a listed note outside the follow-up session whose
            list it is on. `follow_up_exists`: a member reopening a listed note
            while a suggestion waits at its household.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /follow-ups/{id}/remove:
    post:
      tags: [Follow-ups]
      operationId: removeFollowUp
      summary: Remove a follow-up
      description: |
        A soft delete: the note stays in the database with who removed it, when
        and the required `reason`, and is left out of every list, count,
        duplicate check and the visit rule from then on. Admins read removed
        notes with `GET /follow-ups?deleted=true`; the author reads their own
        the same way, and is shown any removal made by someone else.

        An admin may dismiss a suggestion or remove a listed note. A member may
        withdraw only their own suggestion, at any time; a listed note,
        even their own, is `403`. A note already removed is `404`. Removing a
        listed note never changes which households a follow-up session
        picked: the household just leaves those sessions' lists.

        A `POST` with a body rather than a `DELETE` with a query, so the reason
        never appears in a URL.
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RemoveFollowUpRequest" }
      responses:
        "204": { description: Removed. }
        "400":
          description: The reason is missing, blank or longer than 500 characters.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # =============================================================== History
  /history:
    get:
      tags: [History]
      operationId: listHistory
      summary: Consolidated historical records
      description: |
        **Requires: admin.** Every record across every session.

        Members use `/history/mine` instead; there is deliberately no parameter
        combination here that lets a member reach another member's records.
      parameters:
        - name: blockId
          in: query
          schema: { type: string, format: uuid }
        - name: sessionId
          in: query
          schema: { type: string, format: uuid }
        - name: memberId
          in: query
          schema: { type: string, format: uuid }
        - name: teamId
          in: query
          description: Records stamped with this team.
          schema: { type: string, format: uuid }
        - name: interestLevel
          in: query
          schema: { $ref: "#/components/schemas/InterestLevel" }
        - name: religion
          in: query
          schema: { $ref: "#/components/schemas/Religion" }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Matching records. Filters compose.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HistoryList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /history/mine:
    get:
      tags: [History]
      operationId: listOwnHistory
      summary: The calling member's own records
      description: |
        Scoped to the authenticated user by the server; no parameter names
        another member. `includeTeam=true` also returns records stamped with a
        team the caller is **currently** on (their own are always included). It
        carries no id, so it cannot be pointed at anyone else's team. Records
        still waiting on a teammate's phone are not here until they sync.
      parameters:
        - name: includeTeam
          in: query
          schema: { type: boolean, default: false }
        - name: blockId
          in: query
          schema: { type: string, format: uuid }
        - name: sessionId
          in: query
          schema: { type: string, format: uuid }
        - name: interestLevel
          in: query
          schema: { $ref: "#/components/schemas/InterestLevel" }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: The caller's records.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HistoryList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /history/mine/sessions:
    get:
      tags: [History]
      operationId: listOwnSessionHistory
      summary: The outings the calling member worked, newest first
      description: |
        One row per outing the member recorded in, with the blocks they worked
        and how it went. Scoped to the authenticated user by the server, like
        `/history/mine`.

        The counts are the member's own, not the outing's: two members on the
        same block see different numbers here, and that is the intent — this is
        a record of what *you* did.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: The outings the caller recorded in.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionHistoryList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  # ================================================================= Users
  /users:
    get:
      tags: [Users]
      operationId: listUsers
      summary: List users
      description: "**Requires: admin.**"
      parameters:
        - name: role
          in: query
          schema: { $ref: "#/components/schemas/Role" }
        - name: includeDeactivated
          in: query
          schema: { type: boolean, default: false }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Matching users.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

    post:
      tags: [Users]
      operationId: createUser
      summary: Add someone to the team
      description: |
        **Requires: admin.** Creates a credentials account with an initial
        password. Google-only accounts arrive through sign-in instead and are
        not created here.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateUserRequest" }
      responses:
        "201":
          description: The new user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: That email address already belongs to someone.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /users/me:
    get:
      tags: [Users]
      operationId: getCurrentUser
      summary: The authenticated user
      description: |
        Available to all roles. Clients use the returned `role` for UI
        affordance only — never as an authorization decision.
      responses:
        "200":
          description: The current user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: |
            The account was deactivated after this session was issued. The JWT
            is still valid, so this is checked per request rather than at
            sign-in.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

    patch:
      tags: [Users]
      operationId: updateOwnProfile
      summary: Change your own display name
      description: |
        Available to all roles. Always acts on the caller: there is no id
        parameter, so one member cannot rename another through this operation.
        Changing someone else's account stays admin-only on `PATCH /users/{id}`.

        A name is a label; authorship is by id. Past records therefore show the
        new name, and no visit or record changes author (D-29-2).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateOwnProfileRequest" }
      responses:
        "200":
          description: The caller, with the new name.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: |
            The account was deactivated after this session was issued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: |
            The account was deleted between the per-request check and this
            update. Normally a deleted account is answered with 401 before the
            handler runs.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /users/{id}:
    patch:
      tags: [Users]
      operationId: updateUser
      summary: Change a user's role or activation
      description: |
        **Requires: admin.** An admin cannot demote or deactivate their own
        account, which would risk locking every admin out; that returns `409`.

        Deactivating preserves the user's records and their attribution.
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateUserRequest" }
      responses:
        "200":
          description: The updated user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: An admin attempting to demote or deactivate themselves.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
