# Weekly and grouped: every pull request runs the whole CI, E2E included, and
# Actions minutes are scarce, so a pull request per package would cost too much.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # A new release waits a week before it is proposed: a hijacked publish is
    # usually caught and pulled by then. Security updates are not held back.
    cooldown:
      default-days: 7
    ignore:
      # typescript-eslint 8 takes TypeScript below 6.1, so npm ci refuses 7
      # with ERESOLVE. Lift this once typescript-eslint supports 7.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # The types of the Node the app runs on (the Dockerfile's node:24-alpine,
      # CI's NODE_VERSION): they follow the runtime, never ahead of it, and
      # this bound moves with it.
      - dependency-name: "@types/node"
        versions: [">=25"]
    groups:
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
      npm-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
      # Apart, so one breaking major cannot hold back every routine bump.
      npm-major:
        patterns: ["*"]
        update-types: [major]
    commit-message:
      prefix: chore
      include: scope
    labels: ["type:chore", "area:setup"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: chore
      include: scope
    labels: ["type:chore", "area:ci"]

  # Images are pinned by digest, and these keep the digests current. A new
  # major waits for the owner: node moves with CI's NODE_VERSION, and postgres
  # 18 cannot open a 17 data directory.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
    groups:
      docker:
        patterns: ["*"]
    commit-message:
      prefix: chore
      include: scope
    labels: ["type:chore", "area:docker"]

  # Its postgres is also CI's service image, which Dependabot cannot see:
  # copy the new digest into ci.yml (src/supply-chain.test.ts fails until then).
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
    groups:
      docker-compose:
        patterns: ["*"]
    commit-message:
      prefix: chore
      include: scope
    labels: ["type:chore", "area:docker"]
