# Monthly and grouped, and never rebased unasked: each pull request and each
# rebase is a CI run, and Dependabot would otherwise rebase every open one
# whenever dev moves (#248). Comment "@dependabot rebase" on one to update it.
#
# Each carries the e2e label, so CI runs E2E on it into dev: its commits never
# pass through .githooks/pre-push, where a push from a clone runs E2E first.
#
# Every entry targets dev, like any other change: a bump merged into main would
# reach production without passing through dev and stage. Security updates
# ignore target-branch and still open against main; retarget those to dev.
# They take none of an entry's options, its labels included, so label one e2e.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    rebase-strategy: disabled
    # A new release waits a week before it is proposed: a hijacked publish is
    # usually caught and pulled by then. Security updates are not held back.
    cooldown:
      default-days: 7
    ignore:
      # typescript-eslint 8 takes TypeScript below 6.1, so npm ci refuses 7
      # with ERESOLVE. Lift this once typescript-eslint supports 7.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # The types of the Node the app runs on (the Dockerfile's node:24-alpine,
      # CI's NODE_VERSION): they follow the runtime, never ahead of it, and
      # this bound moves with it.
      - dependency-name: "@types/node"
        versions: [">=25"]
    groups:
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
      npm-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
      # Apart, so one breaking major cannot hold back every routine bump.
      npm-major:
        patterns: ["*"]
        update-types: [major]
    commit-message:
      prefix: chore
      include: scope
    labels: ["type:chore", "area:setup", "e2e"]

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    rebase-strategy: disabled
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: chore
      include: scope
    labels: ["type:chore", "area:ci", "e2e"]

  # Images are pinned by digest, and these keep the digests current. A new
  # major waits for the owner: node moves with CI's NODE_VERSION, and postgres
  # 18 cannot open a 17 data directory.
  - package-ecosystem: docker
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    rebase-strategy: disabled
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
      # The e2e stage's ubuntu is the LTS that CI's ubuntu-latest runs (#201),
      # so only its digest moves here; an interim release never fits.
      - dependency-name: ubuntu
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      docker:
        patterns: ["*"]
    commit-message:
      prefix: chore
      include: scope
    labels: ["type:chore", "area:docker", "e2e"]

  # Its postgres is also CI's service image, which Dependabot cannot see: copy
  # the new digest into ci.yml and e2e-catch-up.yml (src/supply-chain.test.ts
  # fails until then).
  - package-ecosystem: docker-compose
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    rebase-strategy: disabled
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
    groups:
      docker-compose:
        patterns: ["*"]
    commit-message:
      prefix: chore
      include: scope
    labels: ["type:chore", "area:docker", "e2e"]
