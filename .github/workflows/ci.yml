name: CI

# Scratch branch only (draft PR, never merged): bisects the WebKit stall seen
# on PR #112 by running the E2E suite once per candidate revert, several times.
on:
  pull_request:

env:
  NODE_VERSION: "24"

jobs:
  stall:
    name: ${{ matrix.variant }} ${{ matrix.rep }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        variant: [base, nobalance, nobreak, nolargetext, noscrim]
        rep: [1, 2]
        include:
          - variant: base
            rep: 3

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5433/door_to_door_e2e
      AUTH_SECRET: e2e-secret-not-used-anywhere-else

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Install the browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Install gdb
        run: sudo apt-get install -y gdb

      - name: Apply the variant
        run: bash scratch/variant.sh ${{ matrix.variant }}

      - name: Flows that must never break
        run: npm run test:e2e

      - name: Show the stall dumps
        if: always()
        run: |
          ls -la stall-diag 2>/dev/null || echo "no dumps"
          for f in stall-diag/*; do [ -f "$f" ] && head -c 60000 "$f"; done || true

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: diag-${{ matrix.variant }}-${{ matrix.rep }}
          path: |
            stall-diag/
            playwright-report/
            test-results/
          retention-days: 7
