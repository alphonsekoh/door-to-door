name: CI

# Pull requests only (#248). A merge runs none of this: the promotion's pull
# request tested what reaches main, and Vercel deploys it. A merge into dev or
# main only warms the caches (warm-caches.yml). Labelling or retargeting a pull
# request starts nothing here either; e2e-catch-up.yml answers those.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Nothing here writes to the repository. With checkout's
# persist-credentials: false the token also stays out of .git/config, where
# npm ci's install scripts could read it. The lint job reads the pull request's
# labels and base.
permissions:
  contents: read
  pull-requests: read

env:
  NODE_VERSION: "24"

jobs:
  # The other jobs need this one, so a lint failure stops the run in about two
  # minutes, and a draft, which skips it, runs nothing. A skip passes a required
  # check, so a draft's first attempt names this job for no ruleset (GitHub
  # shows a skipped job's name expression as written, not the required name
  # either), and the merge waits for a ready run's. The other jobs keep fixed
  # names for docs-only runs, so a draft's run that begins after the ready
  # run's lint job has finished passes their checks over it: mark a draft
  # ready only once its push's run appears (README). A re-run replays its
  # event, so it runs this job even in a draft's run.
  static:
    name: ${{ github.event.pull_request.draft && github.run_attempt == '1' && 'Lint, types and format (draft, not run)' || 'Lint, types and format' }}
    if: ${{ !github.event.pull_request.draft || github.run_attempt != '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      code: ${{ steps.changes.outputs.code }}
      e2e: ${{ steps.e2e.outputs.e2e }}
    steps:
      # The base and labels as they are now, not as the event recorded them: a
      # re-run replays its event, so it would miss a label or a retarget since.
      # The token is in this step's environment alone, before npm ci.
      - name: Read the pull request as it is now
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq '.base.ref, .labels[].name' > "$RUNNER_TEMP/pull-request"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The test merge commit and its first parent, the base it merges into.
          fetch-depth: 2

      # Docs only: tests and the build are skipped, and report it. A skipped job
      # satisfies a ruleset's required check where paths-ignore would leave it
      # pending. The shell is named for pipefail: a failed diff fails the job.
      - name: Find what this pull request changes
        id: changes
        shell: bash
        run: git diff --no-renames --name-only HEAD^1 HEAD | scripts/ci-changes.sh >> "$GITHUB_OUTPUT"

      - name: Decide whether E2E runs
        id: e2e
        shell: bash
        run: scripts/ci-e2e.sh < "$RUNNER_TEMP/pull-request" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      # Runs `next typegen` first: LayoutProps and PageProps are generated into
      # .next/types, which does not exist on a fresh checkout.
      - name: Typecheck
        run: npm run typecheck

      - name: Format check
        run: npm run format:check

      # openapi.yaml is the source of truth for types, Zod validators and the
      # frontend client (#11), so it is linted like source code.
      - name: Lint the OpenAPI contract
        run: npm run spec:lint

      # Types and Zod validators are generated from openapi.yaml. A spec change
      # without regenerating, or a hand-edited generated file, would let the
      # contract and the code enforcing it drift apart.
      - name: Generated API code matches the contract
        run: |
          npm run generate:api
          if [ -n "$(git status --porcelain -- src/generated)" ]; then
            echo "::error::Generated API code is stale. Run 'npm run generate:api' and commit the result."
            git status --short -- src/generated
            git diff -- src/generated | head -60
            exit 1
          fi

      # Migrations are generated from the schema; a hand-edited snapshot or a
      # schema change without a migration would silently diverge from the
      # database. This never reads the .sql files: an edited one fails the
      # tests instead, against drizzle/checksums.sha256.
      - name: Migrations match the schema
        run: |
          npm run db:generate
          # --porcelain, not "git diff": a new migration is an untracked file,
          # which git diff would not report.
          if [ -n "$(git status --porcelain -- drizzle)" ]; then
            echo "::error::Schema and migrations are out of sync. Run 'npm run db:generate' and commit the result."
            git status --short -- drizzle
            exit 1
          fi

  test:
    name: Tests and coverage
    needs: static
    if: needs.static.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Dependabot updates docker-compose.yml's postgres but never a workflow's
    # service images, so src/supply-chain.test.ts holds these two to it.
    services:
      postgres:
        image: postgres:17-alpine@sha256:e5d2edd28b1f8d40a0a6c0c9cdc545b19b56a0d5d88f94bc11a97d970d4700d0
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: door_to_door_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # The harness alone takes a full URL; the app reads config.yaml instead.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/door_to_door_test

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      # Runs unit, component and integration projects, then enforces the
      # per-glob thresholds. Fails the build if any threshold is missed.
      - name: Test with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  # Reports End-to-end smoke, skipped, the moment the run begins, and never
  # runs. The e2e job waits for lint, so its check comes about two minutes
  # later and takes this name only when it runs: a late skip under it would be
  # the newest, and outrank an E2E run that a label or a retarget started
  # meanwhile (e2e-catch-up.yml). This name is fixed, so the required check
  # never rests on how GitHub names a skipped job.
  e2e-placeholder:
    name: End-to-end smoke
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - run: exit 0

  # Into stage or main always: a promotion is the last check before users see
  # a change. Elsewhere only with the e2e label. The lint job reads both as
  # they are when it starts (scripts/ci-e2e.sh); a label or a retarget after
  # that runs e2e-catch-up.yml. It takes the required name only when it runs.
  e2e:
    name: ${{ needs.static.result == 'success' && needs.static.outputs.e2e == 'true' && 'End-to-end smoke' || 'No end-to-end run' }}
    needs: static
    if: needs.static.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine@sha256:e5d2edd28b1f8d40a0a6c0c9cdc545b19b56a0d5d88f94bc11a97d970d4700d0
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # global-setup creates the database itself, so the server here only has
      # to exist. The app is started by Playwright's webServer, which writes
      # its own config file and passes the credentials as environment.
      E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5433/door_to_door_e2e
      AUTH_SECRET: e2e-secret-not-used-anywhere-else

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      # Each Playwright release pins its browser builds, and those are built per
      # OS release, so both name the cache.
      - name: Name the browsers' cache
        id: browsers-key
        run: |
          . /etc/os-release
          echo "key=playwright-$ID-$VERSION_ID-$(uname -m)-$(node -p "require('playwright-core/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.browsers-key.outputs.key }}

      # Only the engines the suite actually uses: Chromium for Android, WebKit
      # for every browser on iOS. Firefox is not run.
      - name: Install the browsers
        if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium webkit

      # The cache holds the browsers, not the system packages they need.
      - name: Install the browsers' system packages
        if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium webkit

      - name: Flows that must never break
        run: npm run test:e2e

      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  build:
    name: Production build
    needs: static
    if: needs.static.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Cache Next.js build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            next-${{ runner.os }}-

      # Decoys, so the postbuild check has something to catch: a trace only
      # copies files that exist. The config is deliberately invalid, so a build
      # that read it would still fail - it must need no config and no
      # database (D-13-4).
      - name: Plant a decoy config.yaml and .env
        run: |
          echo "decoy: the build must neither read nor copy this file" > config.yaml
          echo "STANDALONE_DECOY=must-not-reach-the-standalone-output" > .env

      # postbuild prunes the .env Next copies into .next/standalone/ and fails
      # if a settings file or secret is left there (#106).
      - run: npm run build
