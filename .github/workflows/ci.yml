name: CI

# Scratch branch only (draft PR, never merged): bisects the WebKit stall seen
# on PR #112 by running the E2E suite once per candidate revert, several times.
on:
  pull_request:

env:
  NODE_VERSION: "24"

jobs:
  stall:
    name: ${{ matrix.variant }} ${{ matrix.rep }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { variant: base, rep: 1 }
          - { variant: base, rep: 2 }
          - { variant: "sha:300c186", rep: 1 }
          - { variant: "sha:300c186", rep: 2 }
          - { variant: "sha:300c186", rep: 3 }
          - { variant: "sha:9e08528", rep: 1 }
          - { variant: "sha:9e08528", rep: 2 }
          - { variant: "sha:d6711af", rep: 1 }
          - { variant: "sha:d6711af", rep: 2 }
          - { variant: "sha:a8a42a5", rep: 1 }
          - { variant: "sha:a8a42a5", rep: 2 }
          - { variant: "sha:2271d72", rep: 1 }

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5433/door_to_door_e2e
      AUTH_SECRET: e2e-secret-not-used-anywhere-else

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Apply the variant
        run: bash scratch/variant.sh "${{ matrix.variant }}"

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Install the browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Install gdb
        run: sudo apt-get install -y gdb

      - name: Flows that must never break
        run: npm run test:e2e
        env:
          DEBUG: pw:browser

      - name: Core dumps
        if: always()
        run: |
          sudo coredumpctl list --no-pager || echo "no core dumps"
          sudo coredumpctl info --no-pager 2>&1 | head -1500 || true

      - name: Show the stall dumps
        if: always()
        run: |
          ls -la stall-diag 2>/dev/null || echo "no dumps"
          for f in stall-diag/*; do [ -f "$f" ] && head -c 60000 "$f"; done || true

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: diag-${{ strategy.job-index }}
          path: |
            stall-diag/
            playwright-report/
            test-results/
          retention-days: 7
